<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vereinsbestellung</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="header">
    <div class="branding">
      <h1>Vereinsbestellung</h1>
      <p>Interne Sammelbestellung für Vereinsmitglieder</p>
    </div>

    <div class="header-right">
      <div id="user-box" class="user-box"></div>

      <!-- Cart-Badge: nur auf Mobile sichtbar -->
      <button
        id="cart-badge-btn"
        class="cart-badge-btn hidden"
        type="button"
        aria-label="Warenkorb öffnen"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span id="cart-badge-count" class="cart-badge-count">0</span>
      </button>

      <button id="logout-btn" class="secondary hidden" type="button">Ausloggen</button>
    </div>
  </header>

  <!-- Shared Overlay für Cart-Drawer UND Filter-Drawer -->
  <div id="cart-overlay" class="cart-overlay" aria-hidden="true"></div>

  <main class="page">
    <section class="card auth-card" id="auth-section">
      <div class="section-head">
        <h2>Login</h2>
      </div>

      <form id="auth-form" class="auth-form">
        <label>
          <span>E-Mail</span>
          <input type="email" id="email" required autocomplete="email">
        </label>

        <label>
          <span>Passwort</span>
          <input type="password" id="password" required autocomplete="current-password">
        </label>

        <div class="actions">
          <button type="submit" id="login-btn">Einloggen</button>
          <button type="button" id="signup-btn" class="secondary">Registrieren</button>
        </div>
      </form>

      <p id="auth-message" class="message"></p>
    </section>

    <section id="products-section" class="shop hidden">

      <!-- Desktop: Sidebar links (Filter) -->
      <aside class="shop-sidebar" id="shop-sidebar-desktop">
        <div class="sidebar-block">
          <p class="sidebar-label">Shop</p>
          <h2>Filter</h2>
        </div>

        <div class="sidebar-block" id="filter-block-category">
          <p class="sidebar-label">Kategorie</p>
          <div class="filter-chip-list" id="filter-chips-category"></div>
        </div>

        <div class="sidebar-block" id="filter-block-supplier">
          <p class="sidebar-label">Lieferant</p>
          <div class="filter-chip-list" id="filter-chips-supplier"></div>
        </div>

        <div class="sidebar-block">
          <button id="filter-reset-btn-desktop" class="secondary small-btn filter-reset-btn" type="button">
            Filter zurücksetzen
          </button>
        </div>
      </aside>

      <section class="shop-content" aria-labelledby="products-heading">
        <div class="shop-topbar">
          <div>
            <p class="sidebar-label">Sortiment</p>
            <h2 id="products-heading">Verfügbare Artikel</h2>
          </div>

          <!-- Mobile: Filter-Toggle-Button -->
          <button
            id="filter-toggle-btn"
            class="filter-toggle-btn secondary"
            type="button"
            aria-label="Filter öffnen"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16">
              <line x1="4" y1="6" x2="20" y2="6"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
              <line x1="11" y1="18" x2="13" y2="18"/>
            </svg>
            Filter
            <span id="filter-active-count" class="filter-active-count hidden">0</span>
          </button>
        </div>

        <!-- Aktive Filter als Chips unter dem Topbar -->
        <div id="active-filter-bar" class="active-filter-bar hidden"></div>

        <div class="shop-main-layout">
          <div class="shop-main-products">
            <div id="products-list" class="products-grid">
              <!-- Produkte werden per app.js eingefügt -->
            </div>
            <p id="products-empty" class="products-empty hidden">Keine Produkte für diese Filter.</p>
          </div>

          <!-- Desktop: Warenkorb als Sidebar -->
          <aside class="shop-cart-sidebar" id="cart-desktop-slot">
            <section class="card cart-card hidden" id="cart-section">
              <div class="section-head">
                <h2>Warenkorb</h2>
              </div>

              <div id="cart-list" class="cart-list">
                <!-- Warenkorb-Elemente werden per app.js eingefügt -->
              </div>

              <div class="cart-footer">
                <p id="cart-total" class="price"></p>
                <button id="submit-order-btn" type="button">Bestellung absenden</button>
              </div>

              <p id="order-message" class="message"></p>
            </section>
          </aside>
        </div>
      </section>
    </section>

    <!-- Mobile Cart Drawer — Bottom Sheet -->
    <div id="cart-drawer" class="cart-drawer" aria-hidden="true" role="dialog" aria-label="Warenkorb">

      <!-- Drag Handle -->
      <div class="cart-drawer-handle" aria-hidden="true"></div>

      <div class="cart-drawer-header">
        <div class="cart-drawer-header-row">
          <div class="cart-drawer-title-row">
            <h2 class="cart-drawer-title">Warenkorb</h2>
            <span id="cart-drawer-item-count" class="cart-drawer-count">0</span>
          </div>
          <button id="cart-drawer-close" class="cart-drawer-close" type="button" aria-label="Warenkorb schließen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="cart-drawer-body">
        <!-- Inhalt wird per JS gespiegelt -->
      </div>

      <div class="cart-drawer-footer">
        <div class="cart-drawer-footer-total">
          <span class="cart-drawer-total-label">Gesamt</span>
          <p id="cart-drawer-total" class="cart-drawer-total-text"></p>
        </div>
        <button id="cart-drawer-submit" type="button" class="cart-drawer-submit-btn">Bestellung absenden</button>
        <p id="cart-drawer-message" class="message"></p>
      </div>
    </div>

    <!-- Mobile Filter Drawer (Left Sheet) -->
    <div id="filter-drawer" class="filter-drawer" aria-hidden="true" role="dialog" aria-label="Filter">
      <div class="filter-drawer-header">
        <h2 class="filter-drawer-title">Filter</h2>
        <button id="filter-drawer-close" class="cart-drawer-close" type="button" aria-label="Filter schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="filter-drawer-body">
        <div class="filter-drawer-section">
          <p class="sidebar-label">Kategorie</p>
          <div class="filter-chip-list" id="filter-chips-category-mobile"></div>
        </div>
        <div class="filter-drawer-section">
          <p class="sidebar-label">Lieferant</p>
          <div class="filter-chip-list" id="filter-chips-supplier-mobile"></div>
        </div>
      </div>

      <div class="filter-drawer-footer">
        <button id="filter-reset-btn-mobile" class="secondary filter-reset-btn" type="button">
          Filter zurücksetzen
        </button>
        <button id="filter-apply-btn" type="button">Anwenden</button>
      </div>
    </div>

  </main>
</body>
</html>
